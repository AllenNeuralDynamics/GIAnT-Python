[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "giant-python"
description = "Python translation of the GIAnT-MATLAB analysis package."
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Allen Institute for Neural Dynamics"}
]
classifiers = [
    "Programming Language :: Python :: 3"
]
readme = "README.md"
dynamic = ["version"]

# NOTE: The SLAP2 band-scan (BandSILo) source-extraction backend requires
# ``slap2_utils`` (raw SLAP2 data-file reader). It is not published on PyPI, so
# it is installed directly from source via the git URL below.
dependencies = [
    "numpy",
    "scipy",
    "scikit-image",
    "h5py",
    "tifffile",
    "joblib",
    "torch",
    "opencv-python",
    "pandas",
    "bottleneck",
    "slap2_utils @ git+https://github.com/m-xie/SLAP2_Utils.git@multidatafiles",
]

[project.optional-dependencies]
gui = ["napari"]

[project.scripts]
giant = "giant_python.cli:main"

[dependency-groups]
dev = [
    'black',
    'coverage',
    'flake8',
    'interrogate',
    'isort',
    'Sphinx',
    'furo'
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Bundle the default point-spread-function template used by the BandSILo
# (band-scan) source-extraction backend.
giant_python = ["assets/psfs/*.tif"]

[tool.setuptools.dynamic]
version = {attr = "giant_python.__version__"}

[tool.black]
line-length = 79
target_version = ['py310']
exclude = '''

(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | build
    | dist
    | .conda
  )/
  | .gitignore
)
'''

[tool.coverage.run]
omit = ["*__init__*"]
source = ["giant_python", "tests"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "^from .* import .*",
    "^import .*",
    "pragma: no cover"
]
fail_under = 100

[tool.isort]
line_length = 79
profile = "black"
skip = [".conda"]

[tool.interrogate]
exclude = ["setup.py", "docs", "build", ".conda"]
fail-under = 100
